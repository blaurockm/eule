<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hase Runtime Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b1120;
      --bg-elev: #172033;
      --bg-row: #223049;
      --fg: #f1f5f9;
      --fg-dim: #94a3b8;
      --fg-faint: #64748b;
      --accent: #38bdf8;
      --positive: #4ade80;
      --negative: #f87171;
      --warn: #fbbf24;
      --stale: #f87171;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    #status-app {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden { display: none !important; }

    /* ── topbar ─────────────────────────────── */

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar .eyebrow {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-faint);
      margin-bottom: 4px;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--fg-faint);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 2px;
      text-decoration: underline;
      font-family: inherit;
    }
    .btn-link:hover { color: var(--fg-dim); }

    /* ── states ─────────────────────────────── */

    .state { flex: 1; display: flex; flex-direction: column; }

    .state-center {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--bg-row);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-center h2 { font-size: 20px; font-weight: 600; }
    .state-center p { color: var(--fg-dim); font-size: 14px; max-width: 320px; }

    .btn-primary {
      background: var(--accent);
      color: #06121f;
      border: none;
      border-radius: 10px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }

    .banner {
      background: #3f1d1d;
      border: 1px solid #7f1d1d;
      color: #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* ── env cards ──────────────────────────── */

    .env-list { display: flex; flex-direction: column; gap: 14px; }

    .env-card {
      background: var(--bg-elev);
      border-radius: 14px;
      overflow: hidden;
    }

    .env-head {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .env-name {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .tag-prod {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--bg-row);
      color: var(--accent);
      border-radius: 5px;
      padding: 2px 6px;
      font-weight: 600;
      flex: none;
    }

    .badge-age {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 999px;
      padding: 4px 10px;
      white-space: nowrap;
      flex: none;
    }
    .badge-age.fresh { background: rgba(74, 222, 128, 0.15); color: var(--positive); }
    .badge-age.stale { background: rgba(248, 113, 113, 0.16); color: var(--stale); }

    .env-pnl {
      padding: 12px 16px;
      border-top: 1px solid var(--bg-row);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .pnl-cell-label {
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--fg-faint);
      margin-bottom: 4px;
    }

    .pnl-cell-value {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .pnl-cell-value.positive { color: var(--positive); }
    .pnl-cell-value.negative { color: var(--negative); }

    .env-meta {
      padding: 0 16px 12px;
      font-size: 11px;
      color: var(--fg-faint);
      font-variant-numeric: tabular-nums;
    }

    .strat-list { list-style: none; }

    .strat {
      padding: 11px 16px;
      border-top: 1px solid var(--bg-row);
    }

    .strat-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .strat-name {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .strat-state {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 5px;
      padding: 2px 7px;
      background: var(--bg-row);
      color: var(--fg-dim);
      white-space: nowrap;
      flex: none;
    }
    .strat-state.ok { color: var(--positive); }
    .strat-state.warn { color: var(--warn); }
    .strat-state.err { color: var(--negative); }

    .strat-msg {
      margin-top: 4px;
      font-size: 12px;
      color: var(--fg-dim);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .strat-problems {
      margin-top: 4px;
      font-size: 11px;
      color: var(--warn);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .strat-empty {
      padding: 14px 16px;
      border-top: 1px solid var(--bg-row);
      font-size: 12px;
      color: var(--fg-faint);
      font-style: italic;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      color: var(--fg-faint);
    }

    @media (max-width: 360px) {
      .pnl-cell-value { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main id="status-app">
    <div class="topbar hidden" id="topbar">
      <div>
        <p class="eyebrow">Hase</p>
        <h1>Runtime-Status</h1>
      </div>
      <button class="btn-link" id="logout-btn" type="button">abmelden</button>
    </div>

    <div class="state state-center" id="view-loading">
      <div class="spinner"></div>
      <p>Lade…</p>
    </div>

    <div class="state state-center hidden" id="view-login">
      <h2>Runtime-Status</h2>
      <p>Anmeldung erforderlich.</p>
      <button class="btn-primary" id="login-btn" type="button">Mit Google anmelden</button>
      <p id="login-error" class="hidden" style="color: var(--negative)"></p>
    </div>

    <div class="state hidden" id="view-data">
      <div class="banner hidden" id="data-error"></div>
      <div class="env-list" id="env-list"></div>
      <footer>
        <p>aktualisiert <span id="fetched-at">–</span> · Auto-Refresh 60 s</p>
      </footer>
    </div>
  </main>

  <script type="module" src="status.js"></script>
</body>
</html>
