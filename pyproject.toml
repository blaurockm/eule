[project]
name = "eule"
version = "0.1.0"
description = "Trade Journal + Portfolio Monitor CLI"
authors = [
    {name = "blaurock"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "typer>=0.15.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "loguru>=0.7.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "ibind[oauth]>=0.1.21",
    "trading-ig>=0.0.23",
    "munch>=4.0.0",
    "yfinance>=0.2.55",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "matplotlib>=3.7",
    "tzdata>=2024.1",
    "openpyxl (>=3.1.5,<4.0.0)",
]

[project.scripts]
eule = "eule.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

# Optionale Gruppe: Doku-Build (baut u.a. die hase-Doku auf dem Server).
# Installation: poetry install --with docs
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.7,<10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
